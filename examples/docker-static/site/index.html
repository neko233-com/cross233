<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross233 Docker 穿透文档</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e7ecff; }
    main { max-width: 820px; margin: 0 auto; padding: 72px 24px; }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #17365f; color: #8dc8ff; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 18px 0; }
    p, li { line-height: 1.7; color: #bdc8e6; }
    section { margin-top: 28px; padding: 20px; border: 1px solid #28365e; border-radius: 16px; background: #111a31; }
    code { color: #8fe7c2; }
  </style>
</head>
<body data-cross233-template="docker-static">
  <main>
    <span class="badge">cross233 · Docker static template</span>
    <h1>内网服务已经穿透</h1>
    <p>此页面由本机 Docker 容器提供，并通过 cross233 暴露到公网。看到本页表示公网端口、server、client 和本地容器链路均正常。</p>

    <section>
      <h2>替换成你的服务</h2>
      <ol>
        <li>静态站点：替换 <code>site/</code> 目录后重新构建镜像。</li>
        <li>已有容器：保持容器只绑定 <code>127.0.0.1</code>，把 client 的 <code>localAddr</code> 指向它。</li>
        <li>修改 client 的 <code>remotePort</code> 选择公网端口，不要使用 SSH 的 <code>22</code>。</li>
      </ol>
    </section>
  </main>
</body>
</html>
