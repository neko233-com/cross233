name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: |
          cd web
          npm ci
          npm run build
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check build
        run: cargo check --workspace

  release:
    name: release (${{ matrix.target }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: |
          cd web
          npm ci
          npm run build
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux musl)
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p cross233-server -p cross233-client --target ${{ matrix.target }}
          else
            cargo build --release -p cross233-server -p cross233-client --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          chmod +x cross233-server cross233-client
          tar -czf ../../../cross233-${{ github.ref_name }}-${{ matrix.target }}.tar.gz cross233-server cross233-client
        shell: bash

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/cross233-server.exe, target/${{ matrix.target }}/release/cross233-client.exe -DestinationPath cross233-${{ github.ref_name }}-${{ matrix.target }}.zip
        shell: pwsh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: cross233-${{ github.ref_name }}-${{ matrix.target }}.*
